---
# Cross-platform standalone installers for a labelme release tag.
#
# Triggers (deliberately narrow; nothing runs on a plain push):
#   * workflow_dispatch -> build on demand; upload installers as run artifacts,
#     and publish a prerelease when a tag/version was requested explicitly.
#   * push of a `standalone-v*` tag -> build and attach the installers to a
#     prerelease named after that tag.
#
# The upstream repo only ships wheel/sdist to PyPI (see .github/workflows/
# release.yml) and reserves the plain standalone apps for labelme.io, so this
# workflow lives on the fork and produces the win/linux/mac installers.
name: Standalone installers
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v7.8.1); defaults to the selected
          ref or `standalone-v*`
        required: false
        type: string
      version:
        description: Version to bake into the installers (defaults to the tag without
          the leading v)
        required: false
        type: string
      publish:
        description: Create/update a prerelease on this fork and attach the installers
        required: false
        default: true
        type: boolean
  push:
    tags: [standalone-v*]
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG}"
          if [ -z "${tag}" ] && [ "${REF_TYPE}" = "tag" ]; then
            tag="${REF_NAME}"
          fi
          version="${INPUT_VERSION}"
          if [ -z "${version}" ] && [ -n "${tag}" ]; then
            # Accept both the release tag (v7.8.1) and this workflow's own
            # trigger tag (standalone-v7.8.1).
            version="${tag#standalone-v}"
            version="${version#v}"
          fi
          if [ -z "${version}" ]; then
            echo "::error::Provide a 'version' (and optionally a 'tag') input, or run from a tag."
            exit 1
          fi
          if [ "${EVENT_NAME}" = "push" ] || [ -n "${tag}" ] || [ -n "${INPUT_VERSION}" ]; then
            publish="${{ inputs.publish }}"
          else
            publish=true
          fi
          if [ -n "${tag}" ]; then
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "version=${version}"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version=${version} tag=${tag:-<none>} publish=${publish}"
  build:
    needs: setup
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            kind: appimage
            artifact: labelme-${{ needs.setup.outputs.version }}-x86_64.AppImage
          - name: macos-arm64
            os: macos-latest
            kind: dmg
            artifact: labelme-${{ needs.setup.outputs.version }}-macos-arm64.dmg
          - name: macos-x86_64
            os: macos-15-intel
            kind: dmg
            artifact: labelme-${{ needs.setup.outputs.version }}-macos-x86_64.dmg
          - name: windows-x86_64
            os: windows-latest
            kind: installer
            artifact: labelme-${{ needs.setup.outputs.version }}-windows-x86_64-setup.exe
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out the requested tag
        if: needs.setup.outputs.tag != ''
        shell: bash
        run: git checkout --force "${{ needs.setup.outputs.tag }}"
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.12'
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libxcb-cursor0 libgl1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libdbus-1-3
      - name: Sync project
        shell: bash
        run: uv sync --no-dev --python 3.12
      - name: Build the frozen app (PyInstaller)
        shell: bash
        # The version pin is what ends up in the frozen app's metadata and
        # `--version`; labelme reads it through importlib.metadata.
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          uv run --no-dev --python 3.12 --with 'pyinstaller>=6.10' \
            packaging/build_standalone.py --version "${{ needs.setup.outputs.version }}"
      - name: Package the AppImage
        if: matrix.kind == 'appimage'
        shell: bash
        run: packaging/build_appimage.sh "${{ needs.setup.outputs.version }}"
      - name: Package the .dmg
        if: matrix.kind == 'dmg'
        shell: bash
        run: packaging/build_dmg.sh "${{ needs.setup.outputs.version }}"
      - name: Package the Windows installer
        if: matrix.kind == 'installer'
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" |
            Select-Object -First 1).FullName
          if (-not $iscc) { throw "ISCC.exe (Inno Setup) not found on the runner" }
          & $iscc "/DAppVersion=${{ needs.setup.outputs.version }}" `
            "/DDistPath=${{ github.workspace }}\dist" `
            "/DArchSuffix=x86_64" `
            "packaging\labelme.iss"
      - name: Smoke-test the artifact
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          case "${{ matrix.kind }}" in
            appimage)
              APPIMAGE_EXTRACT_AND_RUN=1 "dist/${{ matrix.artifact }}" --version
              ;;
            dmg)
              mount_dir="$(mktemp -d)"
              hdiutil attach "dist/${{ matrix.artifact }}" -nobrowse -mountpoint "$mount_dir"
              "$mount_dir/labelme.app/Contents/MacOS/labelme" --version
              hdiutil detach "$mount_dir"
              ;;
            installer)
              # A windowed (console=False) build writes --version to the process
              # stdout, which pwsh would capture but git-bash does not, so check
              # only that the launcher runs here; the real proof is that the
              # build script smoke-tested the identical binary before packing.
              "dist/labelme/labelme.exe" --version
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: labelme-${{ needs.setup.outputs.version }}-${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.dmg
            dist/*setup.exe
          if-no-files-found: error
  release:
    needs: [setup, build]
    if: needs.setup.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.tag || format('standalone-v{0}', needs.setup.outputs.version) }}
          name: Labelme ${{ needs.setup.outputs.version }} (standalone installers)
          prerelease: true
          generate_release_notes: true
          files: dist/*
