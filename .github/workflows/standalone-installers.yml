---
# Cross-platform standalone installers for a labelme release.
#
# Triggers (deliberately narrow; nothing runs on a plain push):
#   * push of a `standalone-v*` tag -> builds from that tag and attaches the
#     installers to a prerelease named after it. The tag has to contain
#     packaging/ (i.e. be created on top of this branch).
#   * workflow_dispatch -> same build, optionally without publishing.
#
# The upstream repo only ships wheel/sdist to PyPI (see .github/workflows/
# release.yml) and reserves the plain standalone apps for labelme.io, so this
# workflow lives on the fork and produces the win/linux/mac installers.
name: Standalone installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to bake into the installers (defaults to the tag name)
        required: false
        type: string
      publish:
        description: Create/update a prerelease on this fork and attach the installers
        required: false
        default: true
        type: boolean
  push:
    tags: [standalone-v*]
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The checked-out ref is what gets built, so this workflow only makes
          # sense on a ref that carries packaging/ (i.e. a standalone-v* tag).
          version="${INPUT_VERSION}"
          if [ -z "${version}" ] && [ "${REF_TYPE}" = "tag" ]; then
            version="${REF_NAME#standalone-v}"
            version="${version#v}"
          fi
          if [ -z "${version}" ]; then
            echo "::error::Provide a 'version' input, or run this workflow from a standalone-v* tag."
            exit 1
          fi
          release_tag="standalone-v${version}"
          publish="true"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            publish="${{ inputs.publish }}"
          fi
          {
            echo "version=${version}"
            echo "release_tag=${release_tag}"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version=${version} release_tag=${release_tag} publish=${publish}"
  build:
    needs: setup
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            kind: appimage
            artifact: labelme-${{ needs.setup.outputs.version }}-x86_64.AppImage
          - name: macos-arm64
            os: macos-latest
            kind: dmg
            artifact: labelme-${{ needs.setup.outputs.version }}-macos-arm64.dmg
          - name: macos-x86_64
            os: macos-15-intel
            kind: dmg
            artifact: labelme-${{ needs.setup.outputs.version }}-macos-x86_64.dmg
          - name: windows-x86_64
            os: windows-latest
            kind: installer
            artifact: labelme-${{ needs.setup.outputs.version }}-windows-x86_64-setup.exe
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.12'
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libxcb-cursor0 libgl1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libdbus-1-3
      - name: Sync project
        shell: bash
        run: uv sync --no-dev --python 3.12
      - name: Build the frozen app (PyInstaller)
        shell: bash
        # The version pin is what ends up in the frozen app's metadata and
        # `--version`; labelme reads it through importlib.metadata.
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          uv run --no-dev --python 3.12 --with 'pyinstaller>=6.10' \
            packaging/build_standalone.py --version "${{ needs.setup.outputs.version }}"
      - name: Package the AppImage
        if: matrix.kind == 'appimage'
        shell: bash
        run: packaging/build_appimage.sh "${{ needs.setup.outputs.version }}"
      - name: Package the .dmg
        if: matrix.kind == 'dmg'
        shell: bash
        run: packaging/build_dmg.sh "${{ needs.setup.outputs.version }}"
      - name: Package the Windows installer
        if: matrix.kind == 'installer'
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" |
            Select-Object -First 1).FullName
          if (-not $iscc) { throw "ISCC.exe (Inno Setup) not found on the runner" }
          & $iscc "/DAppVersion=${{ needs.setup.outputs.version }}" `
            "/DDistPath=${{ github.workspace }}\dist" `
            "/DArchSuffix=x86_64" `
            "packaging\labelme.iss"
      - name: Smoke-test the artifact
        # Windows is skipped on purpose: its windowed (console=False) build
        # writes --version to the process stdout, which bash cannot reliably
        # capture here, and the identical dist/labelme/labelme.exe was already
        # smoke-tested by build_standalone.py just above. Inno Setup failing to
        # find the files covers the remaining packaging risk.
        if: matrix.kind != 'installer'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          case "${{ matrix.kind }}" in
            appimage)
              APPIMAGE_EXTRACT_AND_RUN=1 "dist/${{ matrix.artifact }}" --version
              ;;
            dmg)
              mount_dir="$(mktemp -d)"
              hdiutil attach "dist/${{ matrix.artifact }}" -nobrowse -mountpoint "$mount_dir"
              "$mount_dir/labelme.app/Contents/MacOS/labelme" --version
              hdiutil detach "$mount_dir"
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: labelme-${{ needs.setup.outputs.version }}-${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.dmg
            dist/*setup.exe
          if-no-files-found: error
  release:
    needs: [setup, build]
    if: needs.setup.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.release_tag }}
          name: Labelme ${{ needs.setup.outputs.version }} (standalone installers)
          prerelease: true
          generate_release_notes: true
          files: dist/*
